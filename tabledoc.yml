$schema: https://tabledoc.queria.io/schemas/dataset/v1.json
name: tsukuba
title: つくば市オープンデータ
description: |-
  つくば市が公開しているオープンデータです。地区別・性別・年齢階級別の人口と、指定緊急避難場所・消防水利・投票所・介護保険事業所・子育て施設・市立学校・駐輪場などの一覧を収録しています。

  出典：つくば市オープンデータカタログ（つくば市）。Queria が加工したものです。
topics:
  - オープンデータ
  - つくば市
  - 人口
  - 避難場所
  - 公衆無線LAN
  - 消防水利
  - 投票所
  - 介護
  - 子育て
  - 学校
  - 駐輪場
homepage: https://github.com/queria-io/dataset-tsukuba
language: ja
licenses:
  - CC-BY-4.0

sources:
