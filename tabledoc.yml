    title: つくば市
    path: https://www.city.tsukuba.lg.jp/
    roles: [rightsHolder]

temporal_coverage: {start: "2003-04-01", end: null}
spatial_coverage: [JP]
update_frequency: irregular
schemas:
  - name: main
    title: メイン
  - name: ods
    title: 自治体標準オープンデータセット
    description: デジタル庁のデータセット定義書どおりの列名・並び・書き方で並べたテーブル。CSV や Excel でダウンロードすれば、そのまま標準形式のファイルとして使える

synonyms: [つくば市, 地区別人口, 避難場所, Wi-Fi, 消火栓, 防火水槽, 投票所]
