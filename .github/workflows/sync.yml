name: Apply

on:
  push:
    branches: [main]
  schedule:
    # 毎月5日 05:00 JST。上流の公開は4月・5月・10月の年3回で、
    # 週次にすると年間およそ50回が空振りになる (それでも毎回スナップショットが増える)
    - cron: "0 20 4 * *"
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    # Queria への書き込みは GitHub Actions の OIDC で 1 時間のトークンを取って行う。
    # contents と pull-requests は、Queria で変更された説明をこのリポジトリに戻す PR に使う
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    uses: queria-io/dataset-shared/.github/workflows/sync.yml@252f25b5f027b83c61e265125e7557259135e8e7
    with:
      dataset_name: tsukuba
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
