schema: ods
name: preschool
title: つくば市 子育て施設一覧（標準形式）
description: |-
  つくば市の子育て施設を、デジタル庁「自治体標準オープンデータセット」の子育て施設一覧の列名・並びで並べたものです。CSV や Excel でダウンロードすると、そのまま標準形式のファイルとして使えます。

  - SQL で使うときは、同じ行を英語の列名で持つ main のテーブルが扱いやすいです
  - 種別は定義書の選択肢に読み替えています
keywords:
  - 自治体標準オープンデータセット
  - 子育て
  - 保育所
  - 幼稚園
  - 認定こども園
  - つくば市
