schema: ods
name: preschool
title: つくば市 子育て施設一覧（標準形式）
description: つくば市の認可保育所等一覧・私立幼稚園・認定こども園一覧・市立幼稚園一覧・地域子育て支援拠点を1つにまとめた子育て施設の一覧を、デジタル庁「自治体標準オープンデータセット」の子育て施設一覧（データ項目定義書 A）の列名・並びで並べたもの。CSV や Excel でダウンロードすれば、そのまま標準形式のファイルとして使える。中身は main.mart_tsukuba_preschool と同じ行で、SQL で使うときは英語の列名のそちらが扱いやすい。ID は市の一覧に無いので空欄。種別は定義書の選択肢に読み替えている（保育所は公立・民間で認可公立保育所・認可私立保育所、幼稚園は公立幼稚園・私立幼稚園、小規模保育事業所と地域子育て支援拠点は その他）。型が書かれていない認定こども園は種別を空欄にしている。
