schema: ods
name: educational_institution
title: つくば市 教育機関一覧（標準形式）
description: つくば市の市立小学校・中学校・義務教育学校・幼稚園の一覧を、デジタル庁「自治体標準オープンデータセット」の教育機関一覧（データ項目定義書 C）の列名・並びで並べたもの。CSV や Excel でダウンロードすれば、そのまま標準形式のファイルとして使える。中身は main.mart_tsukuba_educational_institution と同じ行で、SQL で使うときは英語の列名のそちらが扱いやすい。学校コードは市の一覧に無いので空欄。設置区分は 2（公立）、設置者情報は つくば市。通学区域は定義書に列が無いので出さない。
keywords:
  - 自治体標準オープンデータセット
  - 学校
  - 小学校
  - 中学校
  - 義務教育学校
  - 通学区域
  - つくば市
