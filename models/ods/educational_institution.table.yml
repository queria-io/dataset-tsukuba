schema: ods
name: educational_institution
title: つくば市 教育機関一覧（標準形式）
description: |-
  つくば市の市立学校・幼稚園を、デジタル庁「自治体標準オープンデータセット」の教育機関一覧の列名・並びで並べたものです。CSV や Excel でダウンロードすると、そのまま標準形式のファイルとして使えます。

  - SQL で使うときは、同じ行を英語の列名で持つ main のテーブルが扱いやすいです
  - 学校コードは市の一覧にないため空欄です
keywords:
  - 自治体標準オープンデータセット
  - 学校
  - 小学校
  - 中学校
  - 義務教育学校
  - 通学区域
  - つくば市
annotations: { queria: { themes: [education_culture] } }
