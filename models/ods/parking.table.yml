schema: ods
name: parking
title: つくば市 公営駐車場一覧（標準形式）
description: |-
  つくば市の駅前広場駐車場を、デジタル庁「自治体標準オープンデータセット」の公営駐車場一覧の列名・並びで並べたものです。CSV や Excel でダウンロードすると、そのまま標準形式のファイルとして使えます。

  - SQL で使うときは、同じ行を英語の列名で持つ main のテーブルが扱いやすいです
  - 最大駐車台数は車種ごとに分かれていないため空欄です
keywords:
  - 自治体標準オープンデータセット
  - 駐車場
  - つくばエクスプレス
  - つくば市
annotations: { queria: { themes: [transport_tourism] } }
sources:
