schema: ods
name: parking
title: つくば市 公営駐車場一覧（標準形式）
description: つくば市の駅前広場駐車場（送迎用の市営駐車場）の一覧を、デジタル庁「自治体標準オープンデータセット」の公営駐車場一覧（データ項目定義書 C）の列名・並びで並べたもの。CSV や Excel でダウンロードすれば、そのまま標準形式のファイルとして使える。中身は main.mart_tsukuba_parking と同じ行で、SQL で使うときは英語の列名のそちらが扱いやすい。概要に駐車区分（送迎用）を入れている。料金は料金備考に文章のまま入れている。最大駐車台数は車種ごとに分かれていないので空欄（合計は main の表の capacity）。
keywords:
  - 自治体標準オープンデータセット
  - 駐車場
  - つくばエクスプレス
  - つくば市
annotations: { queria: { themes: [transport_tourism] } }
