schema: ods
name: open_data_list
title: つくば市 オープンデータ一覧（標準形式）
description: つくば市のオープンデータの一覧を、デジタル庁「自治体標準オープンデータセット」のオープンデータ一覧（データ項目定義書 A）の列名・並びで並べたもの。CSV や Excel でダウンロードすれば、そのまま標準形式のファイルとして使える。中身は main.mart_tsukuba_open_data_list と同じ行で、SQL で使うときは英語の列名のそちらが扱いやすい。データセット_ID とファイルの項目は市の一覧に無いので空欄。データ形式はファイル形式、ライセンスと API 対応有無はファイルの項目に入れている。
keywords:
