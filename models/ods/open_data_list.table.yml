schema: ods
name: open_data_list
title: つくば市 オープンデータ一覧（標準形式）
description: |-
  つくば市のオープンデータの一覧を、デジタル庁「自治体標準オープンデータセット」のオープンデータ一覧の列名・並びで並べたものです。CSV や Excel でダウンロードすると、そのまま標準形式のファイルとして使えます。

  - SQL で使うときは、同じ行を英語の列名で持つ main のテーブルが扱いやすいです
  - データセット_ID は市の一覧にないため空欄です
keywords:
  - 自治体標準オープンデータセット
  - オープンデータ
  - カタログ
  - つくば市
annotations: { queria: { themes: [government_finance] } }
