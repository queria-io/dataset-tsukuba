schema: ods
name: bicycle_parking
title: つくば市 公営駐輪場一覧（標準形式）
description: |-
  つくば市の自転車等駐車場を、デジタル庁「自治体標準オープンデータセット」の公営駐輪場一覧の列名・並びで並べたものです。CSV や Excel でダウンロードすると、そのまま標準形式のファイルとして使えます。

  - SQL で使うときは、同じ行を英語の列名で持つ main のテーブルが扱いやすいです
  - 料金と利用時間は、料金備考と日時備考に文章のまま入っています
keywords:
  - 自治体標準オープンデータセット
  - 駐輪場
  - 自転車
  - つくばエクスプレス
  - つくば市
annotations: { queria: { themes: [transport_tourism] } }
sources:
  - path: https://t1070170.dupf.jp/ckan/dataset/j008_001
