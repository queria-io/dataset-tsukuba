schema: ods
name: public_wireless_lan
title: つくば市 公衆無線LANアクセスポイント一覧（標準形式）
description: |-
  つくば市の公衆無線LANアクセスポイントを、デジタル庁「自治体標準オープンデータセット」の公衆無線LANアクセスポイント一覧の列名・並びで並べたものです。CSV や Excel でダウンロードすると、そのまま標準形式のファイルとして使えます。

  - SQL で使うときは、同じ行を英語の列名で持つ main のテーブルが扱いやすいです
  - 緯度経度などは市の CSV にないため空欄です
keywords:
  - 自治体標準オープンデータセット
  - 公衆無線LAN
  - Wi-Fi
  - つくば市
annotations: { queria: { themes: [ict_science] } }
