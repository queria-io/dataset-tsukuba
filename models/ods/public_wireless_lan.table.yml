schema: ods
name: public_wireless_lan
title: つくば市 公衆無線LANアクセスポイント一覧（標準形式）
description: つくば市の公衆無線LANアクセスポイントを、デジタル庁「自治体標準オープンデータセット」の公衆無線LANアクセスポイント一覧の定義書どおりの列名・並びで並べたもの。CSV や Excel でダウンロードすれば、そのまま標準形式のファイルとして使える。中身は main.mart_tsukuba_public_wireless_lan と同じ行で、SQL で使うときは英語の列名のそちらが扱いやすい。市の CSV に無い項目（緯度経度・町字・連絡先メールなど）は空欄にしている。
keywords:
  - 自治体標準オープンデータセット
  - 公衆無線LAN
  - Wi-Fi
  - つくば市
annotations: { queria: { themes: [ict_science] } }
