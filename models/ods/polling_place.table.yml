schema: ods
name: polling_place
title: つくば市 投票所一覧（標準形式）
description: つくば市の投票所を、デジタル庁「自治体標準オープンデータセット」の投票所一覧（データ項目定義書 C）の列名・並びで並べたもの。CSV や Excel でダウンロードすれば、そのまま標準形式のファイルとして使える。中身は main.mart_tsukuba_polling_place と同じ行で、SQL で使うときは英語の列名のそちらが扱いやすい。ID は投票区番号。市の一覧に無い項目（緯度経度・カナ・連絡先など）は空欄にしている。
keywords:
  - 自治体標準オープンデータセット
  - 投票所
  - 選挙
  - つくば市
extensions: { queria: { themes: [government_finance] } }
sources:
  - path: https://t1070170.dupf.jp/ckan/dataset/m027_001
