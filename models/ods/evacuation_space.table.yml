schema: ods
name: evacuation_space
title: つくば市 指定緊急避難場所一覧（標準形式）
description: つくば市の指定緊急避難場所を、デジタル庁「自治体標準オープンデータセット」の指定緊急避難場所一覧の定義書どおりの列名・並び・書き方で並べたもの。CSV や Excel でダウンロードすれば、そのまま標準形式のファイルとして使える。中身は main.mart_tsukuba_emergency_shelter と同じ 11 件で、SQL や地図で使うときは英語の列名のそちらが扱いやすい。災害種別の列は定義書の書き方のまま文字列で持ち、市が公表していない区分は空欄にしている。
keywords:
  - 自治体標準オープンデータセット
  - 指定緊急避難場所
  - 防災
  - つくば市
published: true
