schema: ods
name: fire_hydrant
title: つくば市 消防水利施設一覧（標準形式）
description: つくば市の消防水利（消火栓・防火水槽）を、デジタル庁「自治体標準オープンデータセット」の消防水利施設一覧の定義書どおりの列名・並びで並べたもの。CSV や Excel でダウンロードすれば、そのまま標準形式のファイルとして使える。中身は main.mart_tsukuba_fire_hydrant と同じ 3,546 件で、SQL や地図で使うときは英語の列名のそちらが扱いやすい。市の CSV は住所を持たないので所在地の列は空欄。口径は消火栓の管径で、防火水槽は空欄。
keywords:
