schema: ods
name: care_service
title: つくば市 介護サービス事業所一覧（標準形式）
description: |-
  つくば市の介護保険事業所を、デジタル庁「自治体標準オープンデータセット」の介護サービス事業所一覧の列名・並びで並べたものです。CSV や Excel でダウンロードすると、そのまま標準形式のファイルとして使えます。

  - SQL で使うときは、同じ行を英語の列名で持つ main のテーブルが扱いやすいです
  - 市の一覧にない項目（緯度経度・法人番号など）は空欄です
keywords:
  - 自治体標準オープンデータセット
  - 介護
  - 介護保険
  - 事業所
  - 福祉
  - つくば市
annotations: { queria: { themes: [social_security_health] } }
sources:
