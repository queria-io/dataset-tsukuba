schema: ods
name: care_service
title: つくば市 介護サービス事業所一覧（標準形式）
description: つくば市の介護保険事業所一覧を、デジタル庁「自治体標準オープンデータセット」の介護サービス事業所一覧（データ項目定義書 A）の列名・並びで並べたもの。CSV や Excel でダウンロードすれば、そのまま標準形式のファイルとして使える。中身は main.mart_tsukuba_care_service と同じ行で、SQL で使うときは英語の列名のそちらが扱いやすい。市の一覧に無い項目（カナ・英字・緯度経度・法人番号・利用可能曜日など）は空欄。実施サービスは市の一覧のサービス種類の書き方のまま。
keywords:
  - 自治体標準オープンデータセット
  - 介護
  - 介護保険
  - 事業所
  - 福祉
  - つくば市
extensions: { queria: { themes: [social_security_health] } }
sources:
  - path: https://t1070170.dupf.jp/ckan/dataset/o009_001
