$schema: https://tabledoc.queria.io/schemas/table/v1.json
title: つくば市人口統計
description: つくば市が公開する人口統計を全期間分統合したマートテーブル。基準日ごとに、地区、性別、年齢階級別の人口を収録し、市全体から地区単位までの人口推移を追える。
topics:
  - 人口
  - つくば市
  - 統計
sources: [city]
columns:
  - name: lg_code
    title: 全国地方公共団体コード
    description: 非推奨。local_government_code を使う
  - name: area_code
    title: 地域を識別するコード
  - name: lg_name
    title: 地方公共団体の名称
  - name: reference_date
    title: データの調査年月日
  - name: area_name
    title: 地域の名称
  - name: sex
    title: 性別
    description: male/female
  - name: age_group
    title: 年齢層
    description: 0-4, 5-9, ..., 85+
  - name: population
    title: 該当性別・年齢層の人口
  - name: local_government_code
    title: 全国地方公共団体コード
    entity: city
