schema: main
name: mart_tsukuba_emergency_shelter
title: つくば市 指定緊急避難場所
description: |-
  つくば市の指定緊急避難場所です。1 行が 1 施設で、名称・住所・緯度経度・収容人数と、災害種別ごとの対応可否を持ちます。

  - 市が公開する CSV（2024 年 12 月時点）の全 11 件です。指定避難所や国土地理院の全国データとは対象も件数も違います
keywords:
  - 防災
  - 指定緊急避難場所
  - つくば市
annotations: { queria: { themes: [justice_safety_environment] } }
sources:
  - path: https://www.city.tsukuba.lg.jp/soshikikarasagasu/shichokoshitsukikikanrika/gyomuannai/1/2/1000608.html
  - path: https://www.city.tsukuba.lg.jp/material/files/group/4/202412hinannbasyo.csv
fields:
