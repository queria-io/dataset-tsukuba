    title: 名称
  - name: name_kana
    title: 名称（カナ）
  - name: name_en
    title: 名称（英字）
  - name: address
    title: 所在地（連結表記）
    description: 非推奨。full_address を使う
    annotations: { queria: { semantic: { role: dimension } } }
  - name: pref
    title: 都道府県
    description: 非推奨。prefecture を使う
