version: 2

models:
  - name: mart_tsukuba_care_service
    access: public
    config:
      contract:
        enforced: true
    columns:
      - name: local_government_code
        data_type: VARCHAR
        constraints:
          - type: not_null
      - name: facility_id
        data_type: VARCHAR
        constraints:
          - type: not_null
        data_tests:
          - unique
      - name: name
        data_type: VARCHAR
        constraints:
          - type: not_null
      - name: service_code
        data_type: VARCHAR
      - name: service_type
        data_type: VARCHAR
      - name: full_address
        data_type: VARCHAR
      - name: prefecture
        data_type: VARCHAR
      - name: city
        data_type: VARCHAR
      - name: postal_code
        data_type: VARCHAR
      - name: phone_number
        data_type: VARCHAR
      - name: fax_number
        data_type: VARCHAR
      - name: corporate_name
        data_type: VARCHAR
      - name: business_number
        data_type: VARCHAR
      - name: capacity
        data_type: INTEGER
      - name: preventive_care
        data_type: BOOLEAN
      - name: comprehensive_service
        data_type: BOOLEAN
      - name: service_area
        data_type: VARCHAR
      - name: designated_date
        data_type: DATE
      - name: deemed_category
        data_type: VARCHAR
