version: 2

models:
  - name: mart_tsukuba_bicycle_parking
    access: public
    config:
      contract:
        enforced: true
    columns:
      - name: local_government_code
        data_type: VARCHAR
        constraints:
          - type: not_null
      - name: facility_id
        data_type: VARCHAR
        constraints:
          - type: not_null
        data_tests:
          - unique
      - name: name
        data_type: VARCHAR
        constraints:
          - type: not_null
      - name: sections
        data_type: VARCHAR
      - name: nearest_station
        data_type: VARCHAR
      - name: full_address
        data_type: VARCHAR
      - name: prefecture
        data_type: VARCHAR
      - name: city
        data_type: VARCHAR
      - name: parking_category
        data_type: VARCHAR
      - name: hours_weekday
        data_type: VARCHAR
      - name: hours_holiday
        data_type: VARCHAR
      - name: hours_new_year
        data_type: VARCHAR
      - name: vehicles_regular
        data_type: VARCHAR
      - name: vehicles_temporary
        data_type: VARCHAR
      - name: fee_regular_bicycle
        data_type: VARCHAR
      - name: fee_regular_moped
        data_type: VARCHAR
      - name: fee_regular_motorcycle
        data_type: VARCHAR
      - name: fee_temporary_bicycle
        data_type: VARCHAR
      - name: fee_temporary_moped
        data_type: VARCHAR
      - name: fee_temporary_motorcycle
        data_type: VARCHAR
      - name: capacity_regular_bicycle
        data_type: INTEGER
      - name: capacity_regular_moped
        data_type: INTEGER
      - name: capacity_regular_motorcycle
        data_type: INTEGER
      - name: capacity_temporary_bicycle
        data_type: INTEGER
      - name: capacity_temporary_moped
        data_type: INTEGER
      - name: capacity_temporary_motorcycle
        data_type: INTEGER
      - name: capacity
        data_type: INTEGER
      - name: fee_type
        data_type: VARCHAR
