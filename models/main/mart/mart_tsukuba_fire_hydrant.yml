version: 2

models:
  - name: mart_tsukuba_fire_hydrant
    access: public
    config:
      contract:
        enforced: true
    columns:
      - name: local_government_code
        data_type: VARCHAR
        constraints:
          - type: not_null
      - name: facility_id
        data_type: VARCHAR
        constraints:
          - type: not_null
      - name: facility_type
        data_type: VARCHAR
        constraints:
          - type: not_null
      - name: latitude
        data_type: DOUBLE
      - name: longitude
        data_type: DOUBLE
      - name: diameter
        data_type: INTEGER
      - name: capacity
        data_type: DOUBLE
      - name: fire_station
        data_type: VARCHAR
      - name: ownership
        data_type: VARCHAR
