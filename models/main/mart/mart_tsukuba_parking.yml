version: 2

models:
  - name: mart_tsukuba_parking
    access: public
    config:
      contract:
        enforced: true
    columns:
      - name: local_government_code
        data_type: VARCHAR
        constraints:
          - type: not_null
      - name: facility_id
        data_type: VARCHAR
        constraints:
          - type: not_null
        data_tests:
          - unique
      - name: name
        data_type: VARCHAR
        constraints:
          - type: not_null
      - name: nearest_station
        data_type: VARCHAR
      - name: full_address
        data_type: VARCHAR
      - name: prefecture
        data_type: VARCHAR
      - name: city
        data_type: VARCHAR
      - name: parking_category
        data_type: VARCHAR
      - name: available_notes
        data_type: VARCHAR
      - name: vehicles
        data_type: VARCHAR
      - name: fee_details
        data_type: VARCHAR
      - name: capacity
        data_type: INTEGER
      - name: notes
        data_type: VARCHAR
