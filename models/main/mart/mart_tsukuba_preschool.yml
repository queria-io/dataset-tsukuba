version: 2

models:
  - name: mart_tsukuba_preschool
    access: public
    config:
      contract:
        enforced: true
    columns:
      - name: local_government_code
        data_type: VARCHAR
        constraints:
          - type: not_null
      - name: source_dataset
        data_type: VARCHAR
        constraints:
          - type: not_null
      - name: name
        data_type: VARCHAR
        constraints:
          - type: not_null
      - name: name_kana
        data_type: VARCHAR
      - name: ownership
        data_type: VARCHAR
      - name: facility_type
        data_type: VARCHAR
      - name: full_address
        data_type: VARCHAR
      - name: prefecture
        data_type: VARCHAR
      - name: city
        data_type: VARCHAR
      - name: building_name
        data_type: VARCHAR
      - name: latitude
        data_type: DOUBLE
      - name: longitude
        data_type: DOUBLE
      - name: access
        data_type: VARCHAR
      - name: capacity
        data_type: INTEGER
      - name: phone_number
        data_type: VARCHAR
      - name: fax_number
        data_type: VARCHAR
      - name: corporate_name
        data_type: VARCHAR
      - name: legal_entity_number
        data_type: VARCHAR
      - name: authorized_date
        data_type: DATE
      - name: age_range
        data_type: VARCHAR
      - name: school_bus
        data_type: VARCHAR
      - name: available_days
        data_type: VARCHAR
      - name: start_time
        data_type: VARCHAR
      - name: end_time
        data_type: VARCHAR
      - name: available_notes
        data_type: VARCHAR
      - name: saturday_start_time
        data_type: VARCHAR
      - name: saturday_end_time
        data_type: VARCHAR
      - name: temporary_care
        data_type: VARCHAR
      - name: attendance_area
        data_type: VARCHAR
      - name: url
        data_type: VARCHAR
      - name: notes
        data_type: VARCHAR
