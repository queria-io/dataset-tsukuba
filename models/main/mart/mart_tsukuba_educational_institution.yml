version: 2

models:
  - name: mart_tsukuba_educational_institution
    access: public
    config:
      contract:
        enforced: true
    columns:
      - name: local_government_code
        data_type: VARCHAR
        constraints:
          - type: not_null
      - name: school_type
        data_type: VARCHAR
        constraints:
          - type: not_null
        # シート名が変わって学校種が空になるのをここで止める
        data_tests:
          - not_null
      - name: school_type_name
        data_type: VARCHAR
        constraints:
          - type: not_null
      - name: name
        data_type: VARCHAR
        constraints:
          - type: not_null
      - name: full_address
        data_type: VARCHAR
      - name: city
        data_type: VARCHAR
      - name: town
        data_type: VARCHAR
      - name: street_number
        data_type: VARCHAR
      - name: phone_number
        data_type: VARCHAR
      - name: school_district
        data_type: VARCHAR
