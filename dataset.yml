spec_version: "0.1"
name: tsukuba
title: つくば市オープンデータ
description: つくば市が公開している統計データ。地区別・性別・年齢階級別の人口と、指定緊急避難場所・公衆無線LANアクセスポイント・消防水利・投票所・介護保険事業所・子育て施設・市立学校・駐輪場・駅前広場駐車場・オープンデータの一覧を収録する
keywords:
  - オープンデータ
  - つくば市
  - 人口
  - 避難場所
  - 公衆無線LAN
  - 消防水利
  - 投票所
  - 介護
  - 子育て
  - 学校
  - 駐輪場
homepage: https://github.com/queria-io/dataset-tsukuba
language: ja
themes: [justice_safety_environment, population, ict_science, government_finance, social_security_health, education_culture, transport_tourism]

licenses:
  - CC-BY-4.0

sources:
  - title: つくば市オープンデータ
    path: https://www.city.tsukuba.lg.jp/

contributors:
  - title: つくば市
    path: https://www.city.tsukuba.lg.jp/
    roles: [rightsHolder]

temporal_coverage: { start: "2003-04-01", end: null }
spatial_coverage: [JP]
update_frequency: irregular
cover: 🏙️

ai_context:
  instructions: |
    つくば市の地区単位の人口構成や、市内の避難場所の分布を調べるのに使う。
    対象はつくば市のみで、全国の市区町村を比べる用途には使えない。
    人口は1行が「地区 × 性別 × 年齢階級 × 調査年月日」で、合計行は無いので
    地区の総人口を出すには合計する。市全体の行は含まれない。
    収録は2003年4月1日からで、4月・5月・10月を中心に年2〜3回の調査。
    つくばエクスプレス開業(2005年)の前後を跨いでいるので、沿線の地区の
    立ち上がりが追える。最新の時点は reference_date の最大値を見る。
    地区はすべての時点に同じだけあるわけではない。
    新しい住宅地は途中から現れ、古い地区は途中で消えることがあるので、
    地区を跨いで比べるときは同じ調査年月日で揃える。
    年齢階級は 0-4 から 85+ までの5歳刻み。
    避難場所は市の公式 CSV を自治体標準オープンデータセット形式に整形したもので、
    緯度経度は住所からのジオコーディングで補完している（元データに座標が無いため、
    精度は住所レベル）。
    国土地理院の全国データ（gsi）にも同じ施設が入っているが、指定時点も項目も別なので
    件数は一致しない。
    公衆無線LAN・消防水利・投票所は市のオープンデータカタログの一覧をそのまま整形したもの。
    緯度経度を持つのは消防水利だけで、公衆無線LANと投票所には座標が無い。
    消防水利は防火水槽と消火栓を1つの表にまとめ、種別で分けている。住所は無い。
    子育て施設は認可保育所・私立幼稚園と認定こども園・市立幼稚園・地域子育て支援拠点の4つの一覧を
    1つにまとめ、元の一覧を source_dataset で分けている。緯度経度を持つのは子育て施設と消防水利。
    介護保険事業所は1行が事業所とサービスの組なので、事業所の数を数えるときは事業所番号で重複を除く。
  synonyms: [つくば市, 地区別人口, 避難場所, Wi-Fi, 消火栓, 防火水槽, 投票所]
  examples:
    - つくば市の地区別の人口を出したい
    - 年齢階級別の人口構成を地区ごとに比べたい
    - つくば市の指定緊急避難場所を地図に出したい
    - つくば市の消火栓と防火水槽を地図に出したい
    - つくば市の投票所と投票区の一覧がほしい
    - つくば市の保育所と幼稚園を地図に出したい
    - つくば市の小学校の通学区域を調べたい

schemas:
  - name: main
    title: メイン
  - name: ods
    title: 自治体標準オープンデータセット
    description: デジタル庁のデータセット定義書どおりの列名・並び・書き方で並べたビュー。CSV や Excel でダウンロードすれば、そのまま標準形式のファイルとして使える
